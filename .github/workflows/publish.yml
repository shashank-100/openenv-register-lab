name: Publish and verify
on:
  push:
    branches: [main]
    paths: ["server/**", "Dockerfile", "requirements.txt", "openenv.yaml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/shashank-100/openenv-register-lab:v1
          labels: |
            org.opencontainers.image.source=https://github.com/shashank-100/openenv-register-lab
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Run published image
        run: |
          docker run --name register-lab -d -p 8000:8000 ghcr.io/shashank-100/openenv-register-lab:v1
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs register-lab
          exit 1
      - name: Validate pinned OpenEnv and test rewards
        run: |
          docker exec register-lab openenv validate --url http://localhost:8000
          docker cp tests register-lab:/tmp/tests
          docker exec -u 0 register-lab pip install pytest
          docker exec -e PYTHONPATH=/app register-lab python -m pytest /tmp/tests -q
          curl -fsS http://localhost:8000/schema
